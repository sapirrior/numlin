name: Publish to npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for provenance
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Run Quality Checks (Tests)
        run: npm test
        # This ensures we NEVER publish a broken build. 
        # The workflow will stop here if any test fails.

      - name: Build Library
        run: npm run build
        # We build fresh from source to ensure dist/ is perfectly synced.

      - name: Verify Package Contents
        run: npm pack --dry-run
        # Final "wise check" to see what files will be included in the tarball.

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # --provenance adds a cryptographic link between the npm package and this GitHub Action.
        # This uses the NPM_TOKEN secret you configured in your repository settings.
